snapshots:
  - name: snap_client_month_metrics
    relation: ref('mart_client_month_metrics')
    description: >
      Restatement history of the client report (Class 5). The mart is rebuilt every run, so last week's
      September PMPM is overwritten when late claims / reversals / retro eligibility arrive. This snapshot keeps
      every published version, so we can answer "why does September differ from the report we sent the client?"
      dbt_valid_from / dbt_valid_to = when the WAREHOUSE published that number (system time).
    config:
      schema: snapshots
      unique_key: [client_id, plan_id, service_month]   # the mart's grain (composite key, dbt >= 1.9)
      strategy: check                                   # the mart has no reliable updated_at, so compare values
      check_cols: [member_months, paid_fills, plan_paid, plan_paid_pmpm, generic_dispensing_rate, is_complete_month]
      hard_deletes: invalidate                          # a client-month that disappears gets its version closed
      dbt_valid_to_current: "cast('9999-12-31' as timestamp)"
